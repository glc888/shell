name: Build C2 Controller

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile blob2pem_dll.c → blob2pem.dll
        run: cl /LD /Fe:blob2pem.dll blob2pem_dll.c /MT /link bcrypt.lib crypt32.lib

      - name: List files
        run: Get-ChildItem

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 改动：去掉 -F，使用 -D 目录模式
      - name: PyInstaller compile controller.py
        run: pyinstaller -w -D controller.py -n Controller

      # 把编译好的 blob2pem.dll 复制进输出目录dist\Controller
      - name: Copy artifacts
        run: |
          copy blob2pem.dll dist\Controller\

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c2-build
          # 上传整个程序文件夹
          path: dist/Controller
