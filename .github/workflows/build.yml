name: Build Controller GUI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_controller:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show root files
        run: Get-ChildItem

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycryptodome PyQt6 pyinstaller
          python -m pip list

      - name: Verify Cryptodome installation
        run: |
          python -m pip show pycryptodome
          python -c "import Cryptodome; print('✅ Cryptodome模块加载成功')"

      - name: Test import controller
        run: |
          python -c "import controller; print('✅ controller导入成功')"

      - name: PyInstaller build exe
        run: >
          pyinstaller
          -n controller
          --hidden-import Cryptodome
          --hidden-import Cryptodome.Cipher
          --hidden-import Cryptodome.PublicKey
          --hidden-import Cryptodome.Random
          --hidden-import Cryptodome.Util.Padding
          --collect-submodules Cryptodome
          controller.py

      - name: Recursively list all files
        run: Get-ChildItem -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-gui-exe
          path: dist/controller.exe
