name: Build Controller GUI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_controller:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .\venv

      - name: Install dependencies
        run: |
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install cryptography PyQt6 pyinstaller
          .\venv\Scripts\python.exe -m pip list

      - name: Test import
        run: |
          .\venv\Scripts\python.exe -c "import cryptography; print('cryptography OK')"
          .\venv\Scripts\python.exe -c "import controller; print('controller OK')"

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      # 移除 --collect‑all PyQt6；-D目录模式；仅手动补qwindows.dll必需平台插件；UPX压缩；-c保留控制台调试
      - name: PyInstaller build
        shell: cmd
        run: .\venv\Scripts\pyinstaller.exe -D -c controller.py --add-binary ".\venv\Lib\site-packages\PyQt6\Qt6\plugins\platforms\qwindows.dll;PyQt6\Qt6\plugins\platforms" --upx-dir %UPX_DIR% --noconfirm

      - name: Recursively list all files
        run: Get-ChildItem -Recurse . | Format-Table Mode,LastWriteTime,Length,Name

      - name: Validate dist output
        run: |
          if (-not (Test-Path ./dist/controller/controller.exe)) {
              Write-Error "dist output missing!"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-exe
          path: ./dist/controller/
