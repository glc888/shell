name: Build Controller GUI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_controller:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: python -m venv .\venv

      - name: Install dependencies inside venv
        run: |
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install pycryptodomex PyQt6 pyinstaller
          .\venv\Scripts\python.exe -m pip list

      - name: Verify Cryptodome import inside venv
        run: |
          .\venv\Scripts\python.exe -c "import Cryptodome; import Cryptodome.Cipher; import Cryptodome.PublicKey; print('Cryptodome import OK')"

      - name: Test import controller
        run: |
          .\venv\Scripts\python.exe -c "import controller; print('controller import OK')"

      - name: PyInstaller build exe
        run: >
          .\venv\Scripts\pyinstaller.exe
          -n controller
          --hidden-import Cryptodome
          --hidden-import Cryptodome.Cipher
          --hidden-import Cryptodome.PublicKey
          --hidden-import Cryptodome.Random
          --hidden-import Cryptodome.Util.Padding
          --collect-submodules Cryptodome
          controller.py

      - name: Recursively list all files
        run: Get-ChildItem -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-gui-exe
          path: dist/controller.exe
