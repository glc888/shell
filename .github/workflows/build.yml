name: Build C2 Controller

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile blob2pem_dll.c → blob2pem.dll
        run: cl /LD /Fe:blob2pem.dll blob2pem_dll.c /MT /link bcrypt.lib crypt32.lib

      - name: List files after compile dll
        run: Get-ChildItem

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 调试构建：去掉 -w，保留控制台，方便排错；确认全部稳定后再加上 -w
      - name: PyInstaller compile controller.py
        run: >
          pyinstaller -D
          --collect-binaries cryptography
          controller.py
          -n Controller

      # 复制 dll + 两个密钥到输出目录
      - name: Copy artifacts (dll + key files)
        run: |
          copy blob2pem.dll dist\Controller\
          copy c2_public.key dist\Controller\
          copy c2_private.key dist\Controller\
          Get-ChildItem dist\Controller\

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c2-build
          path: dist/Controller
