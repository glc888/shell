name: Build C2 Controller

on:
  workflow_dispatch:  # 仅手动点击按钮触发编译

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile blob2pem_dll.c → blob2pem.dll
        run: cl /LD /Fe:blob2pem.dll blob2pem_dll.c /MT /link bcrypt.lib crypt32.lib

      - name: List files after compile dll
        run: Get-ChildItem

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller compile controller.py
        run: pyinstaller -w -F controller.py -n Controller

      - name: Copy artifacts
        run: |
          copy dist\Controller.exe .
          copy blob2pem.dll .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c2-build
          path: |
            Controller.exe
            blob2pem.dll
