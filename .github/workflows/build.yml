name: Build Controller GUI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_controller:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 去掉-w，带控制台窗口，方便看打包报错；全部写成单行，避开反引号换行bug
      - name: PyInstaller build exe
        run: pyinstaller -n controller --hidden-import Cryptodome --hidden-import Cryptodome.Cipher --hidden-import Cryptodome.PublicKey --hidden-import Cryptodome.Random --hidden-import Cryptodome.Util.Padding controller.py

      - name: List directory for debug
        run: ls -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-gui-exe
          path: dist/controller.exe
